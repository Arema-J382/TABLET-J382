<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Koneksi Tablet</title>
<style>
:root{--bg1:#eef2ff;--bg2:#e0e7ff;--card:rgba(255,255,255,.85);--txt:#1e1b4b;--mut:#6b7280;--pri:#4f46e5;--pri2:#7c3aed;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg1:#0f1024;--bg2:#1b1b3a;--card:rgba(30,30,60,.85);--txt:#eef2ff;--mut:#9ca3af;--okbg:#14532d;--badbg:#7f1d1d;--bd:#33335c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:linear-gradient(135deg,var(--bg1),var(--bg2));background-size:200% 200%;animation:bgmove 18s ease-in-out infinite alternate;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px);display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
@keyframes bgmove{from{background-position:0% 0%}to{background-position:100% 100%}}
.wrap{width:100%;max-width:440px;display:grid;gap:14px}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(79,70,229,.12);animation:up .6s cubic-bezier(.2,.8,.2,1) both;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(79,70,229,.18)}
.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.2s}
.card{position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--pri),var(--pri2),var(--pri));background-size:200% 100%;animation:flow 5s linear infinite;opacity:.85}
@keyframes flow{to{background-position:200% 0}}
.ico{display:inline-block;margin-right:6px;animation:float 2.8s ease-in-out infinite;-webkit-text-fill-color:initial}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
h1{margin:0 0 2px;font-size:22px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 18px;color:var(--mut);font-size:13px}
label{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;gap:10px;align-items:center;margin-top:8px}
select{flex:1;min-width:0;padding:13px 12px;border-radius:14px;border:1.5px solid var(--bd);background:transparent;color:var(--txt);font-size:15px;outline:none;transition:.2s}
select:hover{border-color:var(--pri)}
select{cursor:pointer}
select:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
select option{color:#111}
.badge{display:inline-flex;align-items:center;gap:7px;padding:10px 12px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;transition:.35s;background:var(--bd);color:var(--mut)}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.ok i,.badge.bad i{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.badge.load i{animation:spin .8s linear infinite;border-radius:50%;background:none;border:2px solid currentColor;border-top-color:transparent;width:11px;height:11px}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{position:relative;overflow:hidden;width:100%;margin-top:16px;padding:15px;border:0;border-radius:16px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--pri),var(--pri2));cursor:pointer;box-shadow:0 8px 20px rgba(79,70,229,.35);transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 26px rgba(79,70,229,.42)}
.btn:not(.ghost):not(:disabled)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri);box-shadow:none;margin-top:0;padding:11px;font-size:14px}
.btn.ghost:hover:not(:disabled){background:rgba(79,70,229,.08);box-shadow:none}
.btn:focus-visible,select:focus-visible{outline:3px solid rgba(124,58,237,.45);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{border:1px solid var(--bd);border-radius:16px;padding:14px;transition:.3s}
.mini:hover{border-color:var(--pri);transform:translateY(-2px)}
.mini{animation:up .6s cubic-bezier(.2,.8,.2,1) both}.mini:nth-child(2){animation-delay:.12s}
.mini small{color:var(--mut);font-size:12px}.mini b{display:block;font-size:20px;margin-top:4px}
.mini .nm{display:block;margin-top:4px;font-size:11.5px;color:var(--mut);min-height:14px;word-break:break-word}
.bat{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:8px}
.bat div{height:100%;width:0;border-radius:9px;background:var(--ok);transition:width .6s,background .3s;background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);background-size:60% 100%;background-repeat:no-repeat;animation:batshine 2.6s ease-in-out infinite}
@keyframes batshine{from{background-position:-100% 0}to{background-position:220% 0}}
.code{font:12px ui-monospace,monospace;color:var(--mut);text-align:center;margin-top:12px;word-break:break-all}
/* indikator sinkron 10 detik */
.sync{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--mut);justify-content:center;text-align:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none;transition:background .3s}
.sync.ok i{background:var(--ok);animation:pulse 1.6s infinite;color:var(--ok)}
.sync.bad i{background:var(--bad)}
.sync.send i{background:var(--pri);animation:blink .5s infinite alternate}
@keyframes blink{from{opacity:.3}to{opacity:1}}
.cd{height:3px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:8px}
.cd div{height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:9px}
.cd.run div{animation:cdown var(--hb,60s) linear infinite}
@keyframes cdown{from{width:0}to{width:100%}}
.ov{position:fixed;inset:0;background:rgba(15,16,36,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.25s;z-index:10}
.ov.show{opacity:1;pointer-events:auto}
.modal{background:var(--bg1);color:var(--txt);border-radius:22px;padding:24px;max-width:340px;width:100%;text-align:center;transform:scale(.88) translateY(14px);transition:.3s cubic-bezier(.2,1.3,.4,1);box-shadow:0 24px 60px rgba(0,0,0,.35);border:1px solid var(--bd)}
.ov.show .modal{transform:none}
.modal h3{margin:0 0 8px}.modal p{margin:0 0 18px;color:var(--mut);font-size:14px}
.modal .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal .btn{margin:0;padding:12px;font-size:15px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-120px);background:var(--txt);color:var(--bg1);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;transition:.4s cubic-bezier(.2,1.2,.4,1);z-index:20;max-width:90%;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0)}
/* kolom password pada dialog Perbarui Koneksi */
.pwbox{position:relative;margin:0 0 6px;text-align:left}
.pwin{width:100%;padding:13px 46px 13px 14px;border-radius:14px;border:1.5px solid var(--bd);background:transparent;color:var(--txt);font-size:15px;outline:none;transition:.2s;letter-spacing:.04em}
.pwin:hover{border-color:var(--pri)}
.pwin:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--mut);font-size:17px;cursor:pointer;transition:.2s}
.eye:hover{background:rgba(79,70,229,.1);color:var(--pri)}
.pwerr{min-height:18px;margin:6px 0 12px;font-size:12.5px;font-weight:600;color:var(--bad);text-align:left;opacity:0;transform:translateY(-4px);transition:.25s}
.pwerr.show{opacity:1;transform:none}
.pwbox.err .pwin{border-color:var(--bad);box-shadow:0 0 0 4px rgba(220,38,38,.15)}
.pwbox.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.lock{font-size:34px;line-height:1;margin-bottom:6px;display:inline-block;animation:float 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* indikator status Web Push */
.pstat{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:12px;color:var(--mut);text-align:center;transition:color .3s}
.pstat i{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none;transition:background .3s}
.pstat.ok{color:var(--ok)}.pstat.ok i{background:var(--ok);animation:pulse 1.6s infinite}
.pstat.bad{color:var(--bad)}.pstat.bad i{background:var(--bad)}
#perm{transition:transform .15s,background .2s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1><span class="ico">📱</span>Koneksi Tablet</h1>
    <p class="sub">Pilih tablet lalu hubungkan perangkat ini.</p>
    <label for="tab">Nama Tablet</label>
    <div class="row">
      <select id="tab"><option value="">Memuat data…</option></select>
      <span id="badge" class="badge"><i></i><span>-</span></span>
    </div>
    <button id="btn" class="btn" disabled>Hubungkan</button>
    <div class="code">Kode perangkat: <span id="kode"></span></div>
  </div>

  <div class="card">
    <div class="grid">
      <div class="mini"><small>Jaringan</small><b id="net">-</b><span id="netname" class="nm"></span></div>
      <div class="mini"><small>Baterai</small><b id="batv">-</b><div class="bat"><div id="batbar"></div></div></div>
    </div>
    <div id="sync" class="sync"><i></i><span id="synctxt">Pengiriman status belum aktif</span></div>
    <div id="cd" class="cd"><div></div></div>
  </div>

  <div class="card">
    <button id="perm" class="btn ghost">🔔 Aktifkan Notifikasi &amp; Suara</button>
    <div id="pstat" class="pstat"><i></i><span>Status push belum dicek</span></div>
  </div>
</div>

<div id="ov" class="ov"><div class="modal">
  <div class="lock">🔒</div>
  <h3>Perbarui Koneksi?</h3>
  <p>Apakah Anda yakin memperbarui koneksi di tablet ini? Masukkan password untuk melanjutkan.</p>
  <div id="pwbox" class="pwbox">
    <input id="pw" class="pwin" type="password" placeholder="Masukkan password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Password perbarui koneksi">
    <button id="eye" class="eye" type="button" aria-label="Tampilkan/sembunyikan password">👁</button>
  </div>
  <div id="pwerr" class="pwerr" role="alert"></div>
  <div class="acts"><button id="no" class="btn ghost">Tidak</button><button id="yes" class="btn">Iya</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://vxsopsnopeurnxdkfsbe.supabase.co'; 
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4c29wc25vcGV1cm54ZGtmc2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzM4MjgsImV4cCI6MjEwOTE0OTgyOH0.53GRhBd5Pvjjcqbh4M9ok7HKfqJs7klyxPqomXMEzus'; 
// Kunci PUBLIK VAPID untuk Web Push (isi setelah menjalankan: npx web-push generate-vapid-keys)
const VAPID_PUBLIC_KEY = 'BIPI_SPnl26l3peYek3V1SqvZVEmzrr9sg5m5sZLVWAXndXBkXNlEwktZ7pduc3lzxwx9dbeQ19UAUosJXuDIAA';
// ---- PENGHEMATAN LOG INGESTION & EGRESS SUPABASE ----
// Pengecekan perubahan dilakukan LOKAL tiap 10 detik (tidak memakai internet/Supabase).
// Data baru dikirim ke Supabase HANYA jika: (a) baterai/jaringan berubah, atau (b) sudah waktunya heartbeat.
// Jika dashboard/admin Anda menganggap tablet "mati" setelah X detik tanpa update,
// pastikan X lebih besar dari 2-3 kali HEARTBEAT (default: 60 dtk -> batas offline minimal 180 dtk).
const INTERVAL_CEK = 10000;      // cek lokal tiap 10 detik (gratis)
const HEARTBEAT    = 60000;      // kirim wajib tiap 60 detik walau tidak ada perubahan
const JEDA_MIN     = 10000;      // jarak minimal antar pengiriman saat ada perubahan
const JEDA_GAGAL   = 30000;      // jeda sebelum mencoba lagi bila pengiriman gagal
const TTL_DAFTAR   = 30*60*1000; // daftar tablet di-cache 30 menit
const TTL_PUSH     = 24*60*60*1000; // pendaftaran push tidak diulang selama 24 jam bila tidak berubah
document.documentElement.style.setProperty("--hb", (HEARTBEAT/1000)+"s");
// ==================================================================================
// PASSWORD "PERBARUI KONEKSI"
// Ubah password di sini jika ingin menggantinya di kemudian hari (cukup ganti teks
// di antara tanda petik), lalu simpan, commit ke GitHub, dan Vercel akan deploy ulang.
// Password salah  -> tidak ada data yang diperbarui.
// Password benar  -> koneksi diperbarui seperti biasa.
// ==================================================================================
const PASSWORD_PERBARUI = 'kingemyu';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

// Kode unik perangkat (disimpan permanen di browser/PWA ini)
let kode = localStorage.getItem("kode_sts");
if (!kode) { kode = "TAB-" + crypto.randomUUID().slice(0,13).toUpperCase(); localStorage.setItem("kode_sts", kode); }
$("kode").textContent = kode;

let sel = localStorage.getItem("tab_dipilih") || "", connected = false, busy = false, ownerKode = null, bat = null, sending = false;

/* ---------- UI helpers ---------- */
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("show"),3000); }
function setBadge(state){
  const b=$("badge"); b.className="badge "+state;
  b.lastChild.textContent = {ok:"Terkoneksi",bad:"Belum Terkoneksi",load:"Mengecek…",none:"-"}[state];
  if(state==="ok"||state==="bad"){ $("btn").textContent = connected ? "Perbarui Koneksi" : "Hubungkan"; }
  $("btn").disabled = !(sel && (state==="ok"||state==="bad"));
}
function setSync(state, txt){
  $("sync").className = "sync " + state; $("synctxt").textContent = txt;
  const cd=$("cd"); cd.classList.toggle("run", state==="ok"||state==="send");
  if(state==="ok"){ cd.classList.remove("run"); void cd.offsetWidth; cd.classList.add("run"); }
}
const jam = () => new Date().toLocaleTimeString("id-ID",{hour12:false});

/* ---------- IndexedDB kecil (dibaca juga oleh sw-sync.js untuk Background Sync) ---------- */
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open("tablet-sync",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ try{ const d=await idbOpen(); await new Promise((res,rej)=>{ const t=d.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); d.close(); }catch(e){} }
async function idbDel(k){ try{ const d=await idbOpen(); await new Promise((res,rej)=>{ const t=d.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); d.close(); }catch(e){} }

/* ---------- Timer tahan throttling: Web Worker (fallback setInterval) ---------- */
function buatTicker(fn,ms){
  try{
    const w=new Worker(URL.createObjectURL(new Blob(["setInterval(function(){postMessage(1)},"+ms+")"],{type:"text/javascript"})));
    w.onmessage=fn; return w;
  }catch(e){ return setInterval(fn,ms); }
}

/* ---------- Suara & notifikasi ---------- */
let ac;
function unlockAudio(){ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }
// Alarm dalam aplikasi: amplitudo maksimum (gain 1) lewat kompresor, 6 nada keras.
// Kerasnya mengikuti volume MEDIA perangkat; di volume 100% inilah batas paling keras yang bisa dicapai web.
function playSound(){
  try{
    unlockAudio();
    const comp=ac.createDynamicsCompressor(), master=ac.createGain();
    master.gain.value=1; comp.connect(master).connect(ac.destination);
    [880,1175,1568,880,1175,1568].forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.22;
      o.frequency.value=f; o.type="square"; g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(1,t+.02); g.gain.setValueAtTime(1,t+.15); g.gain.exponentialRampToValueAtTime(.0001,t+.21);
      o.connect(g).connect(comp); o.start(t); o.stop(t+.22);
    });
  }catch(e){}
}
// Notifikasi sistem (nada & volume mengikuti pengaturan perangkat). Jika aplikasi sedang terbuka,
// alarm keras ikut dibunyikan supaya pasti terdengar.
async function notify(title, body){
  toast(title+" — "+body);
  if("Notification" in window && Notification.permission==="granted"){
    try{
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title,{body,icon:"/icon-192.png",badge:"/icon-192.png",tag:"tablet",renotify:true,silent:false});
    }catch(e){}
  }
  if(document.visibilityState==="visible") playSound();
}

/* ---------- Web Push (agar notifikasi + suara tetap muncul saat PWA ditutup) ---------- */
function urlB64(s){ const p="=".repeat((4-s.length%4)%4), b=(s+p).replace(/-/g,"+").replace(/_/g,"/"), r=atob(b); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); }
let pushBusy=false;
function setPush(state,txt){ const e=$("pstat"); e.className="pstat "+state; e.querySelector("span").textContent=txt; }
function samaKey(a,b){ a=new Uint8Array(a); if(a.length!==b.length) return false; for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; }
async function daftarPush(paksa){
  if(pushBusy) return; pushBusy=true;
  try{
    if(!("PushManager" in window)) return setPush("bad","Browser tidak mendukung Web Push");
    if(!VAPID_PUBLIC_KEY || VAPID_PUBLIC_KEY.startsWith("ISI_")) return setPush("bad","Kunci VAPID belum diisi");
    if(Notification.permission!=="granted") return setPush("bad","Izin notifikasi belum aktif");
    if(!sel) return setPush("","Pilih tablet untuk mengaktifkan push");
    const reg = await navigator.serviceWorker.ready;
    const key = urlB64(VAPID_PUBLIC_KEY);
    let s = await reg.pushManager.getSubscription();
    // langganan lama yang dibuat dengan kunci VAPID berbeda tidak akan pernah menerima push -> buat ulang
    if(s && s.options && s.options.applicationServerKey && !samaKey(s.options.applicationServerKey,key)){ await s.unsubscribe(); s=null; }
    if(!s) s = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:key});
    // Hemat request: jangan daftar ulang ke Supabase bila endpoint, tablet, dan kode sama dalam 24 jam terakhir
    const kunci = (s.endpoint||"")+"|"+sel+"|"+kode;
    let cache=null; try{ cache=JSON.parse(localStorage.getItem("push_reg")||"null"); }catch(e){}
    if(!paksa && cache && cache.k===kunci && Date.now()-cache.t<TTL_PUSH){
      return setPush("ok","Push latar belakang aktif — notifikasi tetap masuk saat tablet idle/tidur");
    }
    const {error} = await db.rpc("simpan_push",{p_kode:kode, p_nama:sel, p_sub:s.toJSON()});
    if(error) throw error;
    try{ localStorage.setItem("push_reg",JSON.stringify({k:kunci,t:Date.now()})); }catch(e){}
    setPush("ok","Push latar belakang aktif — notifikasi tetap masuk saat tablet idle/tidur");
  }catch(e){ console.warn("Push gagal:",e); setPush("bad","Push gagal: "+(e.message||e)); }
  finally{ pushBusy=false; }
}
$("perm").onclick = async()=>{
  if(!("Notification" in window)){ unlockAudio(); playSound(); return toast("Browser belum mendukung notifikasi. Di iOS, install dulu ke Layar Utama."); }
  const r = await Notification.requestPermission();
  if(r==="granted"){ daftarPush(); notify("Notifikasi aktif ✅","Suara mengikuti pengaturan perangkat"); }
  else toast("Izin notifikasi ditolak");
};
document.addEventListener("click", unlockAudio, {once:true});

/* ---------- Informasi jaringan & baterai ---------- */
function getNet(){
  const on = navigator.onLine;
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  let nama = "";
  if(on && c){
    const tipe = {wifi:"WiFi",cellular:"Seluler",ethernet:"Ethernet",bluetooth:"Bluetooth",wimax:"WiMAX",other:"Lainnya"}[c.type] || "";
    const gen = c.effectiveType ? c.effectiveType.toUpperCase() : "";
    nama = [tipe,gen].filter(Boolean).join(" ");
  }
  return {on, nama};
}

/* ---------- Kirim status baterai & internet ke Supabase tiap 10 detik ---------- */
// Antrekan status ke IndexedDB + daftarkan Background Sync (dikirim service worker saat internet kembali, meski aplikasi di-minimize/ditutup)
async function antrekanSync(n){
  try{
    await idbSet("pending",{baterai:bat?Math.round(bat.level*100):null,nama:n.nama,t:Date.now()});
    const reg = await navigator.serviceWorker.ready;
    if("sync" in reg){ await reg.sync.register("sync-status"); }
  }catch(e){}
}
let lastSent={sig:"",t:0}, nextTry=0;
const sigStatus = n => [n.on?1:0, n.nama, bat?Math.round(bat.level*100):"-"].join("|");
async function kirimStatus(){
  if(!sel || !connected || sending) return;
  if(ownerKode && ownerKode!==kode) return setSync("bad","Tablet ini terhubung ke perangkat lain");
  const n = getNet(), s = sigStatus(n), now = Date.now();
  const berubah = s!==lastSent.sig, jatuhTempo = now-lastSent.t >= HEARTBEAT;
  if(!berubah && !jatuhTempo) return;                       // tidak ada yang perlu dikirim -> 0 request
  if(berubah && !jatuhTempo && now-lastSent.t < JEDA_MIN) return; // batasi laju saat sering berubah
  if(now < nextTry) return;                                 // jeda setelah gagal
  if(berubah) idbSet("last",{baterai:bat?Math.round(bat.level*100):null,nama:n.nama}); // dipakai sinkron berkala di latar belakang
  if(!navigator.onLine){ antrekanSync(n); return setSync("bad","Offline — status diantre, terkirim otomatis saat online"); }
  sending = true; setSync("send","Mengirim status…");
  const payload = {
    status_internet: n.on ? "ONLINE"+(n.nama?" - "+n.nama:"") : "OFFLINE",
    terakhir_update: new Date().toISOString()
  };
  if(bat) payload.status_baterai = Math.round(bat.level*100);
  // Tanpa .select(): server tidak mengembalikan body; jumlah baris dibaca dari header (count)
  const {error,count} = await db.from("koneksi_tablet").update(payload,{count:"exact"}).eq("nama_tab_sts",sel).eq("kode_sts",kode);
  sending = false;
  if(error){
    nextTry = Date.now()+JEDA_GAGAL;
    if(!navigator.onLine || /fetch|network|load failed|timeout/i.test(error.message||"")) antrekanSync(n);
    return setSync("bad","Gagal kirim: "+error.message);
  }
  if(count===0){ nextTry = Date.now()+JEDA_GAGAL; return setSync("bad","Data koneksi tablet tidak ditemukan"); }
  lastSent = {sig:s,t:Date.now()}; nextTry = 0;
  idbDel("pending");
  setSync("ok","Status terkirim "+jam()+" · hemat: kirim saat berubah / tiap "+(HEARTBEAT/1000)+" dtk");
}
buatTicker(()=>kirimStatus(), INTERVAL_CEK); // dibungkus agar event Worker tidak terbawa sebagai argumen

/* ---------- Jaga layar tetap menyala agar pengiriman 10 detik tidak terhenti ---------- */
let wl = null;
async function jagaLayar(){
  if(!("wakeLock" in navigator)) return;
  try{
    if(connected && document.visibilityState==="visible" && !wl){
      const l = await navigator.wakeLock.request("screen"); wl = l;
      l.addEventListener("release",()=>{
        if(wl!==l) return;            // dilepas manual, abaikan
        wl=null;
        if(document.visibilityState==="visible") setTimeout(jagaLayar,500);
      });
    }
  }catch(e){ wl=null; }
}
function lepasLayar(){ const l=wl; wl=null; if(l) l.release().catch(()=>{}); }
// Wake Lock otomatis dilepas browser saat aplikasi di-minimize; diminta ulang begitu aplikasi terlihat lagi
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ jagaLayar(); kirimStatus(); daftarPush(); if(!rtOk) jadwalRealtime(true); } });
document.addEventListener("click",()=>{ if(connected && !wl) jagaLayar(); });

/* ---------- Data Supabase ---------- */
function renderTablets(names, aktifkan){
  const s=$("tab");
  s.innerHTML='<option value="">— Pilih tablet —</option>'+names.map(n=>`<option>${n}</option>`).join("");
  if(names.includes(sel)){ s.value=sel; if(aktifkan){ checkStatus(); daftarPush(); } }
  else if(aktifkan){ sel=""; ganti_realtime(); }
}
async function loadTablets(){
  // Cache daftar tablet: tampil instan & hemat egress. Di-refresh ke Supabase tiap 30 menit.
  let c=null; try{ c=JSON.parse(localStorage.getItem("daftar_tablet")||"null"); }catch(e){}
  const adaCache = c && Array.isArray(c.n) && c.n.length;
  if(adaCache){
    if(Date.now()-c.t < TTL_DAFTAR) return renderTablets(c.n,true);
    renderTablets(c.n,false);
  }
  const {data,error} = await db.from("data_tablet").select("nama_tab").order("nama_tab");
  if(error){
    if(adaCache) return renderTablets(c.n,true); // pakai cache lama bila gagal
    $("tab").innerHTML='<option value="">Gagal memuat data</option>'; return toast("Gagal: "+error.message);
  }
  const names=[...new Set(data.map(d=>d.nama_tab).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"id",{numeric:true,sensitivity:"base"})); // urut natural: B-1, B-2, ... B-10
  try{ localStorage.setItem("daftar_tablet",JSON.stringify({n:names,t:Date.now()})); }catch(e){}
  renderTablets(names,true);
}
async function checkStatus(){
  if(!sel){ connected=false; ownerKode=null; setSync("","Pengiriman status belum aktif"); return setBadge("none"); }
  setBadge("load");
  const {data,error} = await db.from("koneksi_tablet").select("id,kode_sts").eq("nama_tab_sts",sel).limit(1);
  if(error){ setBadge("none"); return toast("Gagal cek: "+error.message); }
  connected = data.length>0; ownerKode = connected ? data[0].kode_sts : null; setBadge(connected?"ok":"bad");
  if(connected){ kirimStatus(); jagaLayar(); simpanKonfigSW(); siapBackground(); } else { setSync("","Hubungkan tablet untuk mulai mengirim status"); lepasLayar(); }
}
$("tab").onchange = e=>{ sel=e.target.value; localStorage.setItem("tab_dipilih",sel); lastSent={sig:"",t:0}; nextTry=0; ganti_realtime(); checkStatus(); daftarPush(); };

async function simpan(){
  if(busy) return; busy=true; $("btn").disabled=true;
  let error;
  if(!connected){
    ({error} = await db.from("koneksi_tablet").insert({nama_tab_sts:sel,kode_sts:kode,status_sts:"AKTIF"}));
  } else {
    ({error} = await db.from("koneksi_tablet").update({kode_sts:kode,status_sts:"AKTIF"}).eq("nama_tab_sts",sel));
  }
  busy=false;
  if(error){ toast("Gagal: "+error.message); return checkStatus(); }
  lastSent={sig:"",t:0}; nextTry=0;
  await checkStatus(); daftarPush(true); notify("Berhasil","Koneksi "+sel+" tersimpan");
}
function bukaModal(){
  $("pw").value=""; $("pw").type="password"; $("eye").textContent="👁";
  $("pwbox").classList.remove("err","shake"); $("pwerr").classList.remove("show"); $("pwerr").textContent="";
  $("ov").classList.add("show"); setTimeout(()=>$("pw").focus(),300);
}
function tutupModal(){ $("ov").classList.remove("show"); $("pw").value=""; $("pw").blur(); }
function passwordSalah(){
  const b=$("pwbox"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("err","shake");
  $("pwerr").textContent="Password salah. Koneksi tidak diperbarui."; $("pwerr").classList.add("show");
  $("pw").value=""; $("pw").focus(); toast("Password salah — tidak ada data yang diperbarui");
}
function prosesPerbarui(){
  if($("pw").value !== PASSWORD_PERBARUI) return passwordSalah(); // salah: berhenti, tidak ada yang diperbarui
  tutupModal(); simpan();                                          // benar: perbarui data seperti sebelumnya
}
$("btn").onclick = ()=>{ if(!sel) return; connected ? bukaModal() : simpan(); };
$("no").onclick = tutupModal;
$("yes").onclick = prosesPerbarui;
$("pw").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); prosesPerbarui(); } });
$("pw").addEventListener("input",()=>{ $("pwbox").classList.remove("err"); $("pwerr").classList.remove("show"); });
$("eye").onclick = ()=>{ const t=$("pw").type==="password"; $("pw").type=t?"text":"password"; $("eye").textContent=t?"🙈":"👁"; $("pw").focus(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("ov").classList.contains("show")) tutupModal(); });

/* ---------- Realtime: notifikasi + suara saat data koneksi berubah ---------- */
function onRealtime(p){
  const n = p.new && p.new.nama_tab_sts;
  // Abaikan update rutin (status baterai/internet) dari tablet pemilik koneksi, supaya tidak berbunyi tiap 10 detik
  if(p.eventType==="UPDATE" && n===sel && connected && p.new.kode_sts===ownerKode) return;
  if(p.new && p.new.kode_sts===kode && busy===false && n===sel) { checkStatus(); return; }
  // Alarm hanya untuk tablet yang namanya (nama_tab_sts) dipilih DAN kodenya (kode_sts) terdaftar di tablet ini
  const milikSaya = sel && connected && ownerKode===kode;
  if(!n || n===sel){ checkStatus(); if(milikSaya) notify("Info Koneksi", n ? "Data "+n+" berubah" : "Ada koneksi dihapus"); }
}

/* ---------- Auto-reconnect Realtime (WebSocket Supabase) dengan backoff eksponensial ---------- */
let rt=null, rtOk=false, rtTry=0, rtTimer=null;
// Hemat egress Realtime: tiap tablet HANYA menerima perubahan baris tablet yang dipilihnya (filter di sisi server).
// DELETE tidak mendukung filter di Supabase, jadi didengarkan terpisah (jarang terjadi).
function mulaiRealtime(){
  const f = (sel && !/[,()]/.test(sel)) ? "nama_tab_sts=eq."+sel : null;
  const base = {schema:"public",table:"koneksi_tablet"};
  let ch = db.channel("koneksi-"+(sel||"none")+"-"+Date.now());
  if(sel){
    ch = ch.on("postgres_changes",Object.assign({event:"INSERT"},base,f?{filter:f}:{}),onRealtime)
           .on("postgres_changes",Object.assign({event:"UPDATE"},base,f?{filter:f}:{}),onRealtime);
  }
  ch = ch.on("postgres_changes",Object.assign({event:"DELETE"},base),onRealtime)
    .subscribe(st=>{
      if(ch!==rt) return; // abaikan event dari channel lama
      if(st==="SUBSCRIBED"){
        const pulih = rtTry>0; rtOk=true; rtTry=0;
        if(pulih){ checkStatus(); toast("Realtime tersambung kembali"); }
      } else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){
        rtOk=false; jadwalRealtime();
      }
    });
  rt = ch;
}
// Dipanggil saat tablet yang dipilih berganti -> langganan dibuat ulang dengan filter baru
function ganti_realtime(){
  if(rtTimer){ clearTimeout(rtTimer); rtTimer=null; }
  const lama=rt; rt=null; rtTry=0;
  (async()=>{ try{ if(lama) await db.removeChannel(lama); }catch(e){} mulaiRealtime(); })();
}
function jadwalRealtime(segera){
  if(rtTimer){ if(!segera) return; clearTimeout(rtTimer); }
  const d = segera ? 0 : Math.min(30000, 1000*Math.pow(2,rtTry++));
  rtTimer = setTimeout(async()=>{
    rtTimer=null; const lama=rt; rt=null;
    try{ if(lama) await db.removeChannel(lama); }catch(e){}
    mulaiRealtime();
  }, d);
}
mulaiRealtime();
// Watchdog: periksa kesehatan koneksi tiap 20 detik
buatTicker(()=>{ if(!rtTimer && navigator.onLine && (!rt || (rt.state!=="joined" && rt.state!=="joining"))) jadwalRealtime(true); }, 20000);
addEventListener("online",()=>{ if(!rtOk) jadwalRealtime(true); kirimStatus(); });
addEventListener("offline",()=>{ rtOk=false; });

/* ---------- Online / Offline ---------- */
function updNet(first){
  const {on,nama}=getNet(); $("net").textContent=on?"🟢 Online":"🔴 Offline"; $("net").style.color=on?"var(--ok)":"var(--bad)";
  $("netname").textContent = on ? (nama || "") : "Tidak ada jaringan";
  if(!first){ notify("Jaringan", on?"Perangkat kembali online":"Perangkat offline"); if(on){ checkStatus(); } else setSync("bad","Offline — menunggu jaringan…"); }
}
addEventListener("online",()=>updNet()); addEventListener("offline",()=>updNet()); updNet(true);
// Perubahan tipe jaringan (WiFi <-> Seluler) — hanya didukung Chrome/Android
const _c = navigator.connection; if(_c && _c.addEventListener) _c.addEventListener("change",()=>{ updNet(true); kirimStatus(); });

/* ---------- Baterai (Chrome/Android; tidak didukung iOS) ---------- */
if(navigator.getBattery){
  navigator.getBattery().then(b=>{
    bat=b; let warned=false;
    const upd=()=>{ const p=Math.round(b.level*100);
      $("batv").textContent=p+"% "+(b.charging?"⚡":""); const bar=$("batbar");
      bar.style.width=p+"%"; bar.style.background=p<=20?"var(--bad)":p<=50?"#f59e0b":"var(--ok)";
      if(p<=20&&!b.charging&&!warned){warned=true;notify("Baterai Rendah","Tersisa "+p+"%");} if(p>20||b.charging) warned=false; };
    upd(); b.onlevelchange=upd; b.onchargingchange=upd;
    kirimStatus();
  });
} else { $("batv").textContent="N/A"; $("batv").style.fontSize="14px"; }

/* ---------- Init ---------- */
/* ---------- Background Sync & Periodic Sync ---------- */
function simpanKonfigSW(){ if(sel && connected && ownerKode===kode) idbSet("config",{url:SUPABASE_URL,key:SUPABASE_ANON_KEY,nama:sel,kode}); }
async function siapBackground(){
  try{
    if(!("serviceWorker" in navigator)) return;
    const reg = await navigator.serviceWorker.ready;
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
    if("periodicSync" in reg){
      try{
        const st = await navigator.permissions.query({name:"periodic-background-sync"});
        if(st.state==="granted"){ await reg.periodicSync.register("status-berkala",{minInterval:15*60*1000}); }
      }catch(e){}
    }
  }catch(e){}
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js");
  navigator.serviceWorker.addEventListener("message",e=>{
    if(!e.data) return;
    if(e.data.type==="sync-ok"){ setSync("ok","Status terkirim via sinkron latar "+jam()); }
    // push masuk saat aplikasi terbuka -> bunyikan alarm keras dalam aplikasi
    if(e.data.type==="push-in" && document.visibilityState==="visible") playSound();
    // langganan push berubah di browser -> daftarkan ulang
    if(e.data.type==="resub") daftarPush(true);
  });
}
loadTablets();
addEventListener("load",()=>setTimeout(daftarPush,1500));
</script>
